<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — NEXUS AI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="bg-canvas"></canvas>

<nav>
  <div class="logo">NEXUS AI</div>
  <div class="links">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html" class="active">Contact</a>
  </div>
</nav>

<section class="hero">
  <h1>Get In Touch</h1>
  <p>Questions, feedback, or collaboration ideas — we'd love to hear</p>
</section>

<div class="content-section">
  <form id="contactForm">
    <input type="text" placeholder="Your Name" required>
    <input type="email" placeholder="Your Email" required>
    <textarea placeholder="Your Message" rows="5" required></textarea>
    <button type="submit">Send Message</button>
  </form>
  <p id="formStatus" style="margin-top:15px; color:#00f0ff;"></p>
</div>

<footer>© 2024 NEXUS AI — Built with Three.js & imagination ✨</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="bg-only.js"></script>
<script>
  document.getElementById('contactForm').addEventListener('submit', function(e){
    e.preventDefault();
    document.getElementById('formStatus').textContent = "✅ Message sent! (Demo only — connect a real backend to actually send this)";
    this.reset();
  });
</script>
</body>
</html>
